[versions]
agp                  = "8.7.0"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.28"
coreKtx              = "1.15.0"
lifecycleRuntimeKtx  = "2.8.7"
activityCompose      = "1.9.3"
composeBom           = "2024.12.01"
hilt                 = "2.52"
hiltExt              = "1.2.0"
room                 = "2.6.1"
datastore            = "1.1.1"
navigationCompose    = "2.8.4"
coroutines           = "1.9.0"
serialization        = "1.7.3"
retrofit             = "2.11.0"
okhttp               = "4.12.0"
playServicesAuth     = "21.2.0"
workManager          = "2.10.0"
glance               = "1.1.0"
coil                 = "2.7.0"
media3               = "1.4.1"
securityCrypto       = "1.1.0-alpha06"
reorderable          = "2.4.0"
googleServices       = "4.4.2"
firebaseBom          = "33.16.0"
junit                = "4.13.2"
junitExt             = "1.2.1"
espresso             = "3.6.1"

[libraries]
# AndroidX Core
androidx-core-ktx                    = { group = "androidx.core",              name = "core-ktx",                        version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",           version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",     version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",       version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose            = { group = "androidx.activity",          name = "activity-compose",                version.ref = "activityCompose" }

# Compose
androidx-compose-bom              = { group = "androidx.compose",          name = "compose-bom",               version.ref = "composeBom" }
androidx-ui                       = { group = "androidx.compose.ui",       name = "ui" }
androidx-ui-graphics              = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-ui-tooling-preview       = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
androidx-material3                = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended  = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-ui-tooling               = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-ui-test-manifest         = { group = "androidx.compose.ui",       name = "ui-test-manifest" }
androidx-ui-test-junit4           = { group = "androidx.compose.ui",       name = "ui-test-junit4" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt
hilt-android            = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger", name = "hilt-android-compiler",  version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",     name = "hilt-navigation-compose", version.ref = "hiltExt" }
hilt-work               = { group = "androidx.hilt",     name = "hilt-work",              version.ref = "hiltExt" }
hilt-ext-compiler       = { group = "androidx.hilt",     name = "hilt-compiler",          version.ref = "hiltExt" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coroutines
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",  version.ref = "coroutines" }
kotlinx-coroutines-play     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Retrofit + OkHttp
retrofit                    = { group = "com.squareup.retrofit2", name = "retrofit",                          version.ref = "retrofit" }
retrofit-serialization      = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization",   version.ref = "retrofit" }
okhttp                      = { group = "com.squareup.okhttp3",   name = "okhttp",                            version.ref = "okhttp" }
okhttp-logging              = { group = "com.squareup.okhttp3",   name = "logging-interceptor",               version.ref = "okhttp" }

# Google Sign-In + Drive
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }

# WorkManager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# Glance widgets
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }

# Coil image loading (coil-gif: animasyonlu GIF demolarını oynatmak için)
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-gif     = { group = "io.coil-kt", name = "coil-gif",     version.ref = "coil" }

# Media3 ExoPlayer — egzersiz demo videolarını (lokal/uzak) oynatmak için
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui        = { group = "androidx.media3", name = "media3-ui",        version.ref = "media3" }

# Security (EncryptedSharedPreferences for OAuth token)
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Drag-and-drop reorderable lists for Compose
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }

# Testing
junit              = { group = "junit",             name = "junit",            version.ref = "junit" }
androidx-junit     = { group = "androidx.test.ext", name = "junit",            version.ref = "junitExt" }
androidx-espresso  = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-rules = { group = "androidx.test", name = "rules", version = "1.6.1" }
firebase-bom       = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

[plugins]
android-application  = { id = "com.android.application",                    version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
google-services      = { id = "com.google.gms.google-services",             version.ref = "googleServices" }
